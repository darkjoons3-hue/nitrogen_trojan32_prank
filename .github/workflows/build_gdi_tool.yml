name: Build GDI Tool
on:
  push:
    paths:
      - 'gdi_tool/**'
      - '.github/workflows/build_gdi_tool.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile
        working-directory: gdi_tool
        run: |
          cl /nologo /EHsc /O2 /MT /utf-8 /DUNICODE /D_UNICODE main.cpp /Fe:gdi_tool.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib comctl32.lib msimg32.lib
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: gdi_tool
          path: gdi_tool/gdi_tool.exe
